name: Build OTG FlashTool Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android Gradle project
        id: detect_dir
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android-native/settings.gradle.kts" ]; then
            echo "dir=android-native" >> "$GITHUB_OUTPUT"
          else
            ZIP_FILE=$(ls -1 *OTGFlashTool*.zip *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              mkdir -p extracted-android
              unzip -oq "$ZIP_FILE" -d extracted-android
              if [ -f "extracted-android/settings.gradle.kts" ]; then
                echo "dir=extracted-android" >> "$GITHUB_OUTPUT"
              elif [ -f "extracted-android/android-native/settings.gradle.kts" ]; then
                echo "dir=extracted-android/android-native" >> "$GITHUB_OUTPUT"
              else
                FOUND=$(find extracted-android -maxdepth 3 -name "settings.gradle.kts" | head -n 1 || true)
                if [ -n "$FOUND" ]; then
                  echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
                else
                  echo "Error: settings.gradle.kts not found inside $ZIP_FILE"
                  exit 1
                fi
              fi
            else
              echo "Error: settings.gradle.kts not found in repository root or android-native/."
              exit 1
            fi
          fi

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${{ runner.temp }}/release.jks" >> "$GITHUB_OUTPUT"
            echo "Release signing keystore detected — will build signed Release APK."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Release signing secrets set — will verify unsigned Release APK + Debug APK."
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK (signed if keystore secrets present, otherwise F-Droid unsigned)
        working-directory: ${{ steps.detect_dir.outputs.dir }}
        env:
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.detect_dir.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifacts
        id: artifacts
        working-directory: ${{ steps.detect_dir.outputs.dir }}
        run: |
          mkdir -p out
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/OTGFlashTool-v${VERSION}.apk"
            cp app/build/outputs/apk/release/app-release.apk "out/OTGFlashTool.apk"
            echo "release_apk=out/OTGFlashTool-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "out/OTGFlashTool.apk"
            if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              cp app/build/outputs/apk/release/app-release-unsigned.apk "out/OTGFlashTool-v${VERSION}-unsigned.apk"
            fi
            echo "release_apk=out/OTGFlashTool.apk" >> "$GITHUB_OUTPUT"
          fi
          ls -lh out/

      - name: Verify signed APK signature
        if: steps.signing.outputs.signed == 'true'
        working-directory: ${{ steps.detect_dir.outputs.dir }}
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "${{ steps.artifacts.outputs.release_apk }}"
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Upload APK artifacts in Actions
        uses: actions/upload-artifact@v4
        with:
          name: OTGFlashTool-APKs
          path: ${{ steps.detect_dir.outputs.dir }}/out/*.apk
          retention-days: 90

      - name: Publish versioned GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_PATH="${{ steps.detect_dir.outputs.dir }}/${{ steps.artifacts.outputs.release_apk }}"
          TITLE="OTG FlashTool ${TAG}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            NOTES="Signed Release APK for OTG FlashTool ${TAG} (Download Mode v2/v3, ADB & Fastboot · Bilingual EN/FA · 100% FOSS & offline)."
          else
            NOTES="OTG FlashTool ${TAG} (add KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets to publish signed Release APKs for IzzyOnDroid)."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Update latest-apk Rolling Release (on main push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          APK_PATH="${{ steps.detect_dir.outputs.dir }}/out/OTGFlashTool.apk"
          TITLE="OTG FlashTool — Native Android APK"
          NOTES="Native Android mobile-to-mobile USB OTG firmware flasher (Download Mode v2/v3, ADB & Fastboot · Bilingual EN/FA · 100% FOSS & F-Droid ready)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
