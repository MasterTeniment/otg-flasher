
name: Build and Sign OTG FlashTool APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed Release APK
        working-directory: OTGFlashTool-Android-Native
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp OTGFlashTool-Android-Native/app/build/outputs/apk/release/app-release.apk out/OTGFlashTool-v2.8.0.apk
          ls -lh out/

      - name: Verify APK signature
        run: |
          apksigner verify --verbose out/OTGFlashTool-v2.8.0.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTGFlashTool-v2.8.0-signed
          path: out/OTGFlashTool-v2.8.0.apk
          retention-days: 90

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" out/OTGFlashTool-v2.8.0.apk --clobber
