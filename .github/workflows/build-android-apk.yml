name: Build OTG FlashTool Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect or extract Android project
        id: detect_dir
        run: |
          if [ -f "android-native/settings.gradle.kts" ]; then
            echo "dir=android-native" >> "$GITHUB_OUTPUT"
          elif [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            ZIP_FILE=$(ls -1 *OTGFlashTool*.zip *FlashOdin*.zip *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              mkdir -p extracted-android
              unzip -oq "$ZIP_FILE" -d extracted-android
              if [ -f "extracted-android/settings.gradle.kts" ]; then
                echo "dir=extracted-android" >> "$GITHUB_OUTPUT"
              elif [ -f "extracted-android/android-native/settings.gradle.kts" ]; then
                echo "dir=extracted-android/android-native" >> "$GITHUB_OUTPUT"
              else
                FOUND=$(find extracted-android -maxdepth 3 -name "settings.gradle.kts" | head -n 1 || true)
                if [ -n "$FOUND" ]; then
                  echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
                else
                  echo "Error: settings.gradle.kts not found inside $ZIP_FILE"
                  exit 1
                fi
              fi
            else
              echo "Error: Please upload the Android source .zip (or unzipped Kotlin project) to your repository root."
              exit 1
            fi
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build OTGFlashTool Debug APK (Installable on Android)
        working-directory: ${{ steps.detect_dir.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Prepare OTGFlashTool.apk artifact
        working-directory: ${{ steps.detect_dir.outputs.dir }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OTGFlashTool.apk
          ls -lh out/OTGFlashTool.apk

      - name: Upload OTGFlashTool.apk for download in Actions
        uses: actions/upload-artifact@v4
        with:
          name: OTGFlashTool-APK
          path: ${{ steps.detect_dir.outputs.dir }}/out/OTGFlashTool.apk
          retention-days: 90

      - name: Publish direct OTGFlashTool.apk to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          APK_PATH="${{ steps.detect_dir.outputs.dir }}/out/OTGFlashTool.apk"
          TITLE="OTG FlashTool — Native Android APK"
          NOTES="Native Android mobile-to-mobile USB OTG firmware flasher (Download Mode v2/v3, ADB & Fastboot · Bilingual EN/FA · Google Play policy-compliant)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release delete-asset "$TAG" "FlashOdin.apk" --yes || true
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
